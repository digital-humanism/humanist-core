[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanist-core"
version = "0.5.0"
description = "Digital Humanism SDK - Human Agency Continuity Protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"

authors = [
    {name = "Digital Humanism Team"}
]

keywords = [
    "ai-safety",
    "human-oversight",
    "hacp",
    "digital-humanism",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "langchain-core>=0.1.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
    "httpx>=0.27.0",
    "jcs>=0.1.5",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "respx>=0.21.0",
]

[project.scripts]
humanist = "humanist_core.hacp.cli:cli"

[project.urls]
Homepage = "https://github.com/digital-humanism/humanist-core"
Repository = "https://github.com/digital-humanism/humanist-core"
Issues = "https://github.com/digital-humanism/humanist-core/issues"
Documentation = "https://github.com/digital-humanism/humanist-core#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["humanist_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
